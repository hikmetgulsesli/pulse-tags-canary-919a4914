<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('record-form');
            const nameInput = document.getElementById('habit-name');
            const nameError = document.getElementById('name-error');
            const inputs = form.querySelectorAll('input, textarea');
            const unsavedIndicator = document.getElementById('unsaved-indicator');
            const unsavedIndicatorMobile = document.getElementById('unsaved-indicator-mobile');
            
            let isDirty = false;

            // Track changes to show unsaved indicator
            inputs.forEach(input => {
                input.addEventListener('change', () => {
                    if (!isDirty) {
                        isDirty = true;
                        unsavedIndicator.classList.remove('opacity-0');
                        unsavedIndicatorMobile.classList.remove('opacity-0');
                    }
                });
                
                input.addEventListener('input', () => {
                    if (input === nameInput) {
                        if (nameInput.value.trim() !== '') {
                            nameInput.classList.remove('border-error', 'focus:ring-error');
                            nameInput.classList.add('border-outline-variant', 'focus:ring-primary');
                            nameError.classList.add('hidden');
                        }
                    }
                });
            });

            // Form validation and submission simulation
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                if (nameInput.value.trim() === '') {
                    nameInput.classList.remove('border-outline-variant', 'focus:ring-primary');
                    nameInput.classList.add('border-error', 'focus:ring-error');
                    nameError.classList.remove('hidden');
                    nameInput.focus();
                    return;
                }

                // Simulate save success
                const submitBtn = document.getElementById('ACT_SAVE_RECORD');
                const originalText = submitBtn.innerHTML;
                
                submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> Saved';
                submitBtn.classList.remove('bg-primary', 'hover:bg-on-primary-fixed-variant');
                submitBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
                
                isDirty = false;
                unsavedIndicator.classList.add('opacity-0');
                unsavedIndicatorMobile.classList.add('opacity-0');

                setTimeout(() => {
                    submitBtn.innerHTML = originalText;
                    submitBtn.classList.add('bg-primary', 'hover:bg-on-primary-fixed-variant');
                    submitBtn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
                    // In a real app, this would route back to operations
                }, 1500);
            });
        });
    </script>
